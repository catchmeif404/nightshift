<path class="ln" d="M 1152 736 L 1085 736" marker-end="url(#h)"/>
<text class="lb" x="1116" y="720" text-anchor="middle">merged</text>
<rect class="card" x="64.5" y="160.5" width="199" height="95" rx="10"/>
<text class="t" x="164" y="203" font-size="15" text-anchor="middle" font-weight="600">Owner</text>
<text class="t m" x="164" y="223" font-size="14" text-anchor="middle">asks in Telegram</text>
<rect class="card" x="336.5" y="160.5" width="199" height="95" rx="10"/>
<text class="t" x="436" y="193" font-size="15" text-anchor="middle" font-weight="600">PM bot · Hermes</text>
<text class="t m" x="436" y="213" font-size="14" text-anchor="middle">files tickets; woken</text>
<text class="t m" x="436" y="233" font-size="14" text-anchor="middle">when a worker ends</text>
<rect class="card" x="608.5" y="160.5" width="199" height="95" rx="10"/>
<text class="t" x="708" y="193" font-size="15" text-anchor="middle" font-weight="600">Notion ticket DB</text>
<text class="t m" x="708" y="213" font-size="14" text-anchor="middle">assigned to</text>
<text class="t m" x="708" y="233" font-size="14" text-anchor="middle">Claude Code</text>
<rect class="card" x="880.5" y="160.5" width="199" height="95" rx="10"/>
<text class="t" x="980" y="193" font-size="15" text-anchor="middle" font-weight="600">notion_board.py</text>
<text class="t m" x="980" y="213" font-size="14" text-anchor="middle">command-board script</text>
<text class="t m" x="980" y="233" font-size="14" text-anchor="middle">Notion ↔ nightshift</text>
<rect class="card" x="1152.5" y="336.5" width="199" height="95" rx="10"/>
<text class="t" x="1252" y="369" font-size="15" text-anchor="middle" font-weight="600">nightshift service</text>
<text class="t m" x="1252" y="389" font-size="14" text-anchor="middle">launchd, every</text>
<text class="t m" x="1252" y="409" font-size="14" text-anchor="middle">2 minutes</text>
<rect class="card" x="608.5" y="336.5" width="199" height="95" rx="10"/>
<text class="t" x="708" y="369" font-size="15" text-anchor="middle" font-weight="600">claude_dev_runner.sh</text>
<text class="t m" x="708" y="389" font-size="14" text-anchor="middle">entry point; switch</text>
<text class="t m" x="708" y="409" font-size="14" text-anchor="middle">nightshift.enabled</text>
<rect class="accent" x="880.5" y="336.5" width="199" height="95" rx="10"/>
<text class="t" x="980" y="369" font-size="15" text-anchor="middle" font-weight="600">nightshift</text>
<text class="t m" x="980" y="389" font-size="14" text-anchor="middle">dispatch; one worker</text>
<text class="t m" x="980" y="409" font-size="14" text-anchor="middle">per project (max 5)</text>
<rect class="dashed" x="608.5" y="512.5" width="199" height="95" rx="10"/>
<text class="t" x="708" y="545" font-size="15" text-anchor="middle" font-weight="600">legacy bash runner</text>
<text class="t m" x="708" y="565" font-size="14" text-anchor="middle">only when the switch</text>
<text class="t m" x="708" y="585" font-size="14" text-anchor="middle">file is gone</text>
<rect class="card" x="880.5" y="512.5" width="199" height="95" rx="10"/>
<text class="t" x="980" y="545" font-size="15" text-anchor="middle" font-weight="600">Claude Code · sonnet</text>
<text class="t m" x="980" y="565" font-size="14" text-anchor="middle">builds in its own</text>
<text class="t m" x="980" y="585" font-size="14" text-anchor="middle">worktree, opens a PR</text>
<rect class="card" x="1152.5" y="512.5" width="199" height="95" rx="10"/>
<text class="t" x="1252" y="545" font-size="15" text-anchor="middle" font-weight="600">Claude Code · opus</text>
<text class="t m" x="1252" y="565" font-size="14" text-anchor="middle">reviews as CTO,</text>
<text class="t m" x="1252" y="585" font-size="14" text-anchor="middle">fixes small things</text>
<rect class="card" x="1152.5" y="688.5" width="199" height="95" rx="10"/>
<text class="t" x="1252" y="721" font-size="15" text-anchor="middle" font-weight="600">GitHub pull request</text>
<text class="t m" x="1252" y="741" font-size="14" text-anchor="middle">merged by nightshift</text>
<text class="t m" x="1252" y="761" font-size="14" text-anchor="middle">after PASS</text>
<rect class="card" x="880.5" y="688.5" width="199" height="95" rx="10"/>
<text class="t" x="980" y="721" font-size="15" text-anchor="middle" font-weight="600">post_merge.sh</text>
<text class="t m" x="980" y="741" font-size="14" text-anchor="middle">QA smoke on emulator,</text>
<text class="t m" x="980" y="761" font-size="14" text-anchor="middle">figdex release call</text>
