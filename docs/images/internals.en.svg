<svg xmlns="http://www.w3.org/2000/svg" width="1416" height="736" viewBox="0 0 1416 736" role="img" aria-label="Inside nightshift">
<style>
.bg{fill:#f6f8fa} .card{fill:#ffffff;stroke:#d0d7de} .accent{fill:#eaf1fe;stroke:#2f6beb;stroke-width:1.5} .dashed{fill:#ffffff;stroke:#8c959f;stroke-dasharray:6 5}
.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', Helvetica, Arial, sans-serif;fill:#1f2328} .m{fill:#59636e} .ln{stroke:#8c959f;stroke-width:2;fill:none;stroke-linecap:round} .hd{fill:#8c959f} .lb{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', Helvetica, Arial, sans-serif;font-size:12px;fill:#59636e}
@media (prefers-color-scheme: dark){.bg{fill:#0d1117} .card,.dashed{fill:#161b22;stroke:#3d444d} .accent{fill:#0f2a5c;stroke:#4c8dff} .t{fill:#e6edf3} .m,.lb{fill:#9198a1} .ln{stroke:#6e7681} .hd{fill:#6e7681}}
</style>
<defs><marker id="h" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path class="hd" d="M0 0 L4 2 L0 4 Z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1416" height="736" rx="12"/>
<text class="t" x="64" y="96" font-size="24" font-weight="600">Inside nightshift</text>
<path class="ln" d="M 264 208 L 331 208" marker-end="url(#h)"/>
<text class="lb" x="299" y="192" text-anchor="middle">tickets</text>
<path class="ln" d="M 536 208 L 603 208" marker-end="url(#h)"/>
<text class="lb" x="571" y="192" text-anchor="middle">start</text>
<path class="ln" d="M 808 208 L 875 208" marker-end="url(#h)"/>
<path class="ln" d="M 1080 208 L 1147 208" marker-end="url(#h)"/>
<path class="ln" d="M 1252 256 L 1252 331" marker-end="url(#h)"/>
<path class="ln" d="M 1152 368 L 1085 368" marker-end="url(#h)"/>
<text class="lb" x="1116" y="352" text-anchor="middle">result</text>
<path class="ln" d="M 1080 400 L 1147 400" marker-end="url(#h)"/>
<text class="lb" x="1116" y="424" text-anchor="middle">REWORK</text>
<path class="ln" d="M 880 384 L 813 384" marker-end="url(#h)"/>
<text class="lb" x="844" y="368" text-anchor="middle">verdict</text>
<path class="ln" d="M 708 432 L 708 507" marker-end="url(#h)"/>
<text class="lb" x="720" y="475" text-anchor="start">PASS</text>
<path class="ln" d="M 1252 432 L 1252 507" marker-end="url(#h)"/>
<text class="lb" x="1264" y="475" text-anchor="start">developer</text>
<path class="ln" d="M 980 432 L 980 507" marker-end="url(#h)"/>
<text class="lb" x="992" y="475" text-anchor="start">reviewer</text>
<path class="ln" d="M 608 384 L 164 384"/>
<path class="ln" d="M 164 384 L 164 261" marker-end="url(#h)"/>
<text class="lb" x="386" y="368" text-anchor="middle">status + reason + note</text>
<rect class="card" x="64.5" y="160.5" width="199" height="95" rx="10"/>
<text class="t" x="164" y="193" font-size="15" text-anchor="middle" font-weight="600">Board</text>
<text class="t m" x="164" y="213" font-size="14" text-anchor="middle">local-md · GitHub ·</text>
<text class="t m" x="164" y="233" font-size="14" text-anchor="middle">Notion · command</text>
<rect class="card" x="336.5" y="160.5" width="199" height="95" rx="10"/>
<text class="t" x="436" y="193" font-size="15" text-anchor="middle" font-weight="600">Dispatch</text>
<text class="t m" x="436" y="213" font-size="14" text-anchor="middle">run or daemon;</text>
<text class="t m" x="436" y="233" font-size="14" text-anchor="middle">one lock at a time</text>
<rect class="card" x="608.5" y="160.5" width="199" height="95" rx="10"/>
<text class="t" x="708" y="193" font-size="15" text-anchor="middle" font-weight="600">Slots</text>
<text class="t m" x="708" y="213" font-size="14" text-anchor="middle">one worker per project;</text>
<text class="t m" x="708" y="233" font-size="14" text-anchor="middle">release tickets alone</text>
<rect class="card" x="880.5" y="160.5" width="199" height="95" rx="10"/>
<text class="t" x="980" y="193" font-size="15" text-anchor="middle" font-weight="600">Worker</text>
<text class="t m" x="980" y="213" font-size="14" text-anchor="middle">cut-off tickets first,</text>
<text class="t m" x="980" y="233" font-size="14" text-anchor="middle">then ready ones</text>
<rect class="card" x="1152.5" y="160.5" width="199" height="95" rx="10"/>
<text class="t" x="1252" y="193" font-size="15" text-anchor="middle" font-weight="600">Worktree</text>
<text class="t m" x="1252" y="213" font-size="14" text-anchor="middle">own branch per ticket;</text>
<text class="t m" x="1252" y="233" font-size="14" text-anchor="middle">your checkout untouched</text>
<rect class="card" x="1152.5" y="336.5" width="199" height="95" rx="10"/>
<text class="t" x="1252" y="369" font-size="15" text-anchor="middle" font-weight="600">Build</text>
<text class="t m" x="1252" y="389" font-size="14" text-anchor="middle">result: PR, BRANCH,</text>
<text class="t m" x="1252" y="409" font-size="14" text-anchor="middle">DOC or BLOCKED</text>
<rect class="card" x="880.5" y="336.5" width="199" height="95" rx="10"/>
<text class="t" x="980" y="369" font-size="15" text-anchor="middle" font-weight="600">Review</text>
<text class="t m" x="980" y="389" font-size="14" text-anchor="middle">PASS, REWORK,</text>
<text class="t m" x="980" y="409" font-size="14" text-anchor="middle">NEEDS_HUMAN, BLOCKED</text>
<rect class="accent" x="608.5" y="336.5" width="199" height="95" rx="10"/>
<text class="t" x="708" y="369" font-size="15" text-anchor="middle" font-weight="600">Update ticket</text>
<text class="t m" x="708" y="389" font-size="14" text-anchor="middle">moves it to review,</text>
<text class="t m" x="708" y="409" font-size="14" text-anchor="middle">blocked or done</text>
<rect class="card" x="608.5" y="512.5" width="199" height="95" rx="10"/>
<text class="t" x="708" y="545" font-size="15" text-anchor="middle" font-weight="600">Merge</text>
<text class="t m" x="708" y="565" font-size="14" text-anchor="middle">with autoMerge on,</text>
<text class="t m" x="708" y="585" font-size="14" text-anchor="middle">then post-merge command</text>
<rect class="card" x="880.5" y="512.5" width="471" height="95" rx="10"/>
<text class="t" x="1116" y="545" font-size="15" text-anchor="middle" font-weight="600">Coding agents</text>
<text class="t m" x="1116" y="565" font-size="14" text-anchor="middle">Claude Code (default) · Codex · any CLI</text>
<text class="t m" x="1116" y="585" font-size="14" text-anchor="middle">fixed session per stage, resumed after a cut-off</text>
<text class="lb" x="64" y="680" font-size="13">Every stage must leave a one-line result file; anything else is set aside and the stage runs again. State lives in .nightshift/: stage, session, tries, results, log.</text>
</svg>
